name: Daily Build

on:
  schedule:
    - cron: '0 5 * * 1,3,5'   # 05:00 UTC Mon, Wed, Fri
  workflow_dispatch:        # allows manual trigger from GitHub UI

permissions:
  contents: write           # needed to push results back to this repo

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150    # 2.5h safety limit; build typically takes ~90 min

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Ensure Puppeteer Chrome binary is present
        run: npx puppeteer browsers install chrome
        continue-on-error: true

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Run build
        run: node build.js

      - name: Commit and push results + seed
        run: |
          git add docs/results/ docs/index.json seed-data.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily build: $(date -u '+%Y-%m-%d')"
            git push
          fi
