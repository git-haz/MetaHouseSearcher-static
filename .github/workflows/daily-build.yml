name: Daily Build

on:
  schedule:
    - cron: '0 5 * * 1,3,5'   # 05:00 UTC Mon, Wed, Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache Puppeteer Chrome binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: puppeteer-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Ensure Puppeteer Chrome binary is present
        run: npx puppeteer browsers install chrome

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Run build
        run: node build.js --push-every=5 --resume

      - name: Commit and push any remaining changes
        if: always()
        run: |
          git add docs/results/ docs/build-status.json seed-data.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No unpushed changes remaining."
          else
            git commit -m "Build remainder: $(date -u '+%Y-%m-%d')"
            git push
          fi

      - name: Post build summary to issue #1
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INDEX="docs/results/index.json"
          if [ -f "$INDEX" ]; then
            TOTAL=$(jq '.totalResults // "unknown"' "$INDEX")
            COMPLETED=$(jq '.completedLocations // "unknown"' "$INDEX")
            TOTAL_LOC=$(jq '.totalLocations // "unknown"' "$INDEX")
            COMPLETE=$(jq '.complete' "$INDEX")
            GENERATED=$(jq -r '.generatedAt' "$INDEX")
            BODY="✅ **Build complete** — $GENERATED

| | |
|---|---|
| Locations | $COMPLETED / $TOTAL_LOC |
| Properties | $TOTAL |
| Complete | $COMPLETE |
| Run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          else
            BODY="✅ Build finished but index.json not found. [Run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
          gh issue comment 1 --repo ${{ github.repository }} --body "$BODY"
